apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipline-fetcher
  namespace: {{ .Release.Namespace }}
  labels:
    app: fetcher
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orchestration.fetcher.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fetcher
  template:
    metadata:
      labels:
        app: fetcher
      annotations:
        # Scraped by the AMP managed scraper (pod_exporter job) — pull model gives
        # each pod its own series via kubernetes_pod_name, avoiding the multi-writer
        # collision of pushing OTLP from all replicas into one identical series.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8905"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fetcher
          image: "{{ .Values.orchestration.fetcher.image }}:{{ .Values.global.version }}"
          imagePullPolicy: Always
          env:
            - name: PROVIDER
              value: "AWS"
            - name: FETCHER_PORT
              value: "{{ .Values.orchestration.fetcher.port }}"
            - name: AWS_REGION
              value: "{{ .Values.aws.region }}"
            - name: AWS_DEFAULT_REGION
              value: "{{ .Values.aws.region }}"
            - name: KV_TABLE_PREFIX
              value: "{{ .Values.aws.kvTablePrefix }}"
            - name: KV_REPLICA_REGIONS
              value: "{{ .Values.aws.kvReplicaRegions }}"
            - name: CHRONON_METRICS_READER
              value: "prometheus"
            - name: USE_ZGC
              value: "true"
          ports:
            - containerPort: {{ .Values.orchestration.fetcher.port }}
            - name: metrics
              containerPort: 8905
          resources:
          {{- toYaml .Values.orchestration.fetcher.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.orchestration.fetcher.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.orchestration.fetcher.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fetcher-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  selector:
    app: fetcher
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.orchestration.fetcher.port }}
      protocol: TCP
  type: ClusterIP
